# Soft Actor-Critic (off-policy, continuous).
# Defaults from aux/sac_continuous_action.py. Note: the squashed policy outputs
# actions in [-1, 1]; envs whose action range differs should be rescaled.
name: sac
family: off_policy

hidden_dim: 256
buffer_size: 1000000
batch_size: 256
learning_starts: 5000

actor:
  _target_: src.agents.sac.Actor
  log_std_min: -5
  log_std_max: 2

critic:
  _target_: src.agents.sac.Critic

algo:
  _target_: src.agents.sac.SACAgent
  actor_lr: 3e-4
  critic_lr: 1e-3
  alpha_lr: 3e-4
  actor_beta: 0.9
  critic_beta: 0.9
  alpha_beta: 0.9
  critic_tau: 0.005
  init_temperature: 0.2
  discount: 0.99
  actor_update_freq: 2
  critic_target_update_freq: 1
  batch_size: ${agent.batch_size}
