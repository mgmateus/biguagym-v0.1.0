# Twin Delayed DDPG (off-policy, continuous).
# Defaults from aux/td3_continuous_action.py.
name: td3
family: off_policy

hidden_dim: 256
buffer_size: 1000000
batch_size: 256
learning_starts: 25000

actor:
  _target_: src.agents.td3.Actor

critic:
  _target_: src.agents.td3.Critic

algo:
  _target_: src.agents.td3.TD3Agent
  actor_lr: 3e-4
  critic_lr: 3e-4
  actor_beta: 0.9
  critic_beta: 0.9
  tau: 0.005
  discount: 0.99
  policy_noise: 0.2
  noise_clip: 0.5
  exploration_noise: 0.1
  policy_freq: 2
  batch_size: ${agent.batch_size}
